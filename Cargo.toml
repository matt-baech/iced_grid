[package]
name = "iced_grid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, virtualized data grid widget for Iced, with cell selection, copy and resizable columns"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matt-baech/iced_grid"
keywords = ["iced", "grid", "table", "widget", "gui"]
categories = ["gui"]
publish = false

[dependencies]
iced_core = "0.14"

[dev-dependencies]
iced = "0.14"
iced_test = "0.14"
